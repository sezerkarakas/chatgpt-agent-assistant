<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Notebook Destek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* -- Root Variables (Enhanced Palette) -- */
        :root {
            --primary-color: #FF6B00; /* Monster turuncusu */
            --primary-color-dark: #E05E00; /* Hover için */
            --secondary-color: #2C3E50; /* Daha koyu, modern bir gri/mavi */
            --user-bubble: #3498DB; /* Daha canlı bir mavi */
            --ai-bubble: #ECF0F1;   /* Daha açık, nötr bir gri */
            --background: #F7F9FA; /* Çok hafif kirli beyaz */
            --text-dark: #34495E;  /* Daha yumuşak siyah */
            --text-light: #7F8C8D; /* Açık gri */
            --border-color: #E0E0E0; /* Kenarlıklar için */
            --shadow-color: rgba(0, 0, 0, 0.08); /* Gölgeler için */
            --white: #FFFFFF;
        }

        /* -- Base Styles -- */
        body {
            font-family: 'Poppins', sans-serif; /* New font */
            max-width: 900px;
            margin: 0 auto;
            padding: 0;
            background-color: var(--background);
            color: var(--text-dark);
            line-height: 1.6;
            font-weight: 400; /* Default weight */
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            background-color: var(--white);
            overflow: hidden; /* Prevent body scroll */
        }

        /* -- Header -- */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-color-dark)); /* Gradient */
            color: var(--white);
            padding: 1.2rem 1.5rem; /* Compact padding */
            text-align: center;
            box-shadow: 0 4px 12px var(--shadow-color); /* More shadow */
            position: sticky; /* Sticky header */
            top: 0;
            z-index: 10;
            transition: all 0.3s ease;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem; /* Slightly smaller */
            font-weight: 600; /* Bolder */
        }

        /* -- Chat Area -- */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background-color: var(--white); /* Can be white or --background */
        }

        /* -- Scrollbar Styling (Webkit) -- */
        #chat-container::-webkit-scrollbar {
            width: 8px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: var(--background);
            border-radius: 4px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background-color: var(--primary-color);
            border-radius: 4px;
            border: 2px solid var(--background);
        }
        #chat-container::-webkit-scrollbar-thumb:hover {
            background-color: var(--primary-color-dark);
        }

        /* -- Messages & Bubbles -- */
        .message {
            display: flex;
            margin-bottom: 1.2rem; /* Slightly more space */
            animation: fadeIn 0.4s ease-out;
        }

        .user-message {
            justify-content: flex-end;
        }

        .ai-message {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 0.9rem 1.3rem; /* Adjusted padding */
            border-radius: 1.5rem; /* Rounder */
            font-size: 0.95rem; /* Slightly smaller font */
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 3px 8px var(--shadow-color); /* Bubble shadow */
            transition: all 0.3s ease;
        }

        .user-bubble {
            background: linear-gradient(135deg, var(--user-bubble), #2980B9); /* Blue gradient */
            color: var(--white);
            border-bottom-right-radius: 0.4rem; /* Sharp corner */
            border-top-left-radius: 1.5rem;
            border-bottom-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
        }

        .ai-bubble {
            background-color: var(--white); /* Clear white background */
            color: var(--text-dark);
            border: 1px solid var(--border-color); /* Subtle border */
            border-bottom-left-radius: 0.4rem; /* Sharp corner */
            border-top-left-radius: 1.5rem;
            border-bottom-right-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
        }

        /* -- AI Response Formatting -- */
        .ai-response {
            white-space: pre-wrap;
        }

        .ai-response h3 {
            color: var(--primary-color);
            margin-top: 0.8rem;
            margin-bottom: 0.6rem;
            font-size: 1.05rem; /* Slightly larger */
            font-weight: 600; /* Bolder */
            border-bottom: 1px solid var(--border-color); /* Underline */
            padding-bottom: 0.3rem;
        }

        .ai-response ul {
            padding-left: 0.5rem; /* Less indent */
            list-style: none; /* Remove default bullet */
            margin: 0.5rem 0;
        }

        .ai-response li {
            margin-bottom: 0.6rem;
            padding-left: 1.2rem; /* Space for custom bullet */
            position: relative;
        }

        .ai-response li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.5em; /* Vertically center */
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: inline-block;
        }

        /* -- Input Area -- */
        .input-area {
            display: flex;
            align-items: center; /* Vertical alignment */
            padding: 0.8rem 1rem; /* Compact padding */
            background-color: var(--white);
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -2px 10px var(--shadow-color); /* Top shadow */
        }

        #message {
            flex: 1;
            padding: 0.8rem 1.3rem; /* Inner padding */
            border: 1px solid var(--border-color);
            border-radius: 2rem; /* Fully rounded */
            font-size: 0.95rem;
            outline: none;
            background-color: var(--background); /* Slightly different background */
            transition: all 0.3s ease;
        }

        #message:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(255, 107, 0, 0.2); /* Focus glow */
        }

        button {
            margin-left: 0.8rem;
            padding: 0; /* Reset padding for icon */
            width: 45px; /* Fixed width */
            height: 45px; /* Fixed height */
            background: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 50%; /* Circular */
            cursor: pointer;
            display: flex; /* Center icon */
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--primary-color-dark);
            transform: scale(1.05); /* Scale effect */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.98); /* Click effect */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        /* Icon color */
        button svg {
            stroke: var(--white);
            width: 20px; /* Icon size */
            height: 20px;
        }

        /* -- Typing Indicator -- */
        .typing-indicator {
            display: inline-flex;
            padding: 0.8rem 1.2rem;
            background-color: var(--white); /* Match AI bubble BG */
            border: 1px solid var(--border-color); /* Match AI bubble border */
            border-radius: 1.5rem;
            border-bottom-left-radius: 0.4rem; /* Match AI bubble shape */
            box-shadow: 0 3px 8px var(--shadow-color); /* Match AI bubble shadow */
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            margin: 0 3px; /* Slightly more space */
            background-color: var(--text-light);
            border-radius: 50%;
            opacity: 0.4;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        /* -- Animations -- */
        @keyframes typingAnimation {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* -- Responsive Design -- */
        @media (max-width: 768px) {
            body {
                max-width: 100%; /* Use full width */
            }
            .container {
                height: 100vh; /* Ensure full height */
                border-radius: 0;
                box-shadow: none;
            }
            .bubble {
                max-width: 90%; /* Allow slightly wider bubbles */
            }
             #chat-container {
                padding: 1rem; /* Adjust padding */
            }
             .input-area {
                padding: 0.6rem 0.8rem; /* Adjust padding */
            }
            #message {
                padding: 0.7rem 1.1rem; /* Adjust padding */
                font-size: 0.9rem;
            }
             button {
                width: 40px; /* Smaller button */
                height: 40px;
                margin-left: 0.5rem;
            }
            button svg {
                width: 18px; /* Smaller icon */
                height: 18px;
            }
            h1 {
                font-size: 1.4rem; /* Smaller header text */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
             <h1>Monster Notebook Destek Asistanı</h1>
        </header>

        <div id="chat-container">
            </div>

        <div class="input-area">
            <input type="text" id="message" placeholder="Mesajınızı yazın..." autocomplete="off">
            <button onclick="sendMessage()" aria-label="Gönder">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message');
        // IMPORTANT: Replace 'ws://localhost:8000/ws' with your actual WebSocket server URL
        const socket = new WebSocket(`ws://localhost:8000/ws`); // Or wss://your-production-url/ws

        // Show typing indicator
        function showTypingIndicator() {
            // Avoid adding multiple indicators
            if (document.getElementById('typing-indicator')) return;

            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai-message'; // Position like an AI message
            typingDiv.id = 'typing-indicator-message'; // ID for easy removal

            const typingBubble = document.createElement('div');
            // Apply bubble styles + specific indicator class
            typingBubble.className = 'bubble ai-bubble typing-indicator';
            typingBubble.id = 'typing-indicator';

            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                typingBubble.appendChild(dot);
            }

            typingDiv.appendChild(typingBubble);
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            const indicatorMessage = document.getElementById('typing-indicator-message');
            if (indicatorMessage) {
                indicatorMessage.remove();
            }
        }

        // Format AI response text (basic formatting, consider Markdown lib for complex cases)
        function formatResponse(text) {
            // Bold text: **text** -> <strong>text</strong>
             text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // Titles: "Title:" -> <h3>Title:</h3> (at the beginning of a line)
            text = text.replace(/^(\s*.*?:\s*)$/gm, '<h3>$1</h3>'); // Match lines ending with ':'

            // Numbered lists: Match lines starting with number. Gaps between items.
            // This regex tries to handle multiline list items better but is still basic.
            let listHtml = '';
            let inList = false;
            const lines = text.split('\n');
            let accumulatedText = '';

            lines.forEach((line, index) => {
                const listMatch = line.match(/^(\d+)\.\s+(.*)/);
                if (listMatch) {
                    if (!inList) {
                        // If previous text exists, add it before starting list
                        if (accumulatedText.trim()) {
                             listHtml += accumulatedText.trim().replace(/\n/g, '<br>');
                        }
                         accumulatedText = ''; // Reset accumulator
                        listHtml += '<ul>';
                        inList = true;
                    }
                    listHtml += `<li>${listMatch[2].trim()}</li>`; // Add list item
                } else {
                    // If we were in a list and the line is not empty, end the list.
                     if (inList && line.trim() !== '') {
                        listHtml += '</ul>';
                        inList = false;
                    }
                     // Accumulate non-list text or empty lines
                    accumulatedText += line + '\n';
                 }

                // If it's the last line and we are still in a list, close it
                if (index === lines.length - 1 && inList) {
                    listHtml += '</ul>';
                    inList = false; // Ensure state is correct
                 }
            });

             // Append any remaining accumulated text
            if (accumulatedText.trim() && !inList) { // Check !inList to avoid duplication if text ends with list
                 listHtml += accumulatedText.trim().replace(/\n/g, '<br>');
            }

            // If the text was entirely processed as a list or parts of it
            if (listHtml) {
                text = listHtml;
            } else {
                 // If no list was detected, just replace newlines in the original text
                text = accumulatedText.replace(/\n/g, '<br>');
             }

            // Final cleanup for potential <br> tags inside list items if needed (might be overly aggressive)
             text = text.replace(/<li><br>/g, '<li>').replace(/<br><\/li>/g, '</li>');

            return text;
        }

        // Send message
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message !== '') {
                displayMessage(message, 'user');
                socket.send(message);
                showTypingIndicator();
                messageInput.value = '';
                messageInput.focus(); // Keep focus on input
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // Display message on screen
        function displayMessage(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`; // 'user-message' or 'ai-message'

            const bubble = document.createElement('div');
            bubble.className = `bubble ${sender}-bubble`; // 'user-bubble' or 'ai-bubble'

            if (sender === 'ai') {
                hideTypingIndicator(); // Remove indicator before showing AI message
                bubble.classList.add('ai-response'); // Add class for specific AI formatting
                bubble.innerHTML = formatResponse(content); // Format AI content
            } else {
                bubble.textContent = content; // User content as plain text
            }

            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight; // Scroll to bottom
        }

        // WebSocket Event Handlers
        socket.onopen = () => {
            console.log("WebSocket connection established");
            // Optional: Send an initial message or token if required by backend
        };

        socket.onmessage = (event) => {
             // Assuming backend sends messages prefixed like "AI: message content"
             // Adjust this logic based on your actual backend message format
            let messageContent = event.data;
            if (messageContent.startsWith('AI: ')) {
                 messageContent = messageContent.substring(4); // Remove "AI: " prefix
             }
            displayMessage(messageContent, 'ai');
        };

        socket.onerror = (error) => {
            console.error("WebSocket Error:", error);
            // Optionally display an error message to the user
            displayMessage("Bağlantı hatası oluştu. Lütfen sayfayı yenileyin.", 'ai');
            hideTypingIndicator(); // Hide indicator on error
        };

        socket.onclose = (event) => {
            console.log("WebSocket connection closed:", event.reason);
            // Optionally inform the user, unless it's a clean closure
            if (!event.wasClean) {
                 displayMessage("Bağlantı kapandı. Tekrar bağlanmaya çalışılıyor...", 'ai');
                 // Implement reconnection logic if desired
            }
             hideTypingIndicator(); // Hide indicator on close
        };


        // Keyboard shortcut (Enter key)
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { // Send on Enter, allow Shift+Enter for newline
                e.preventDefault(); // Prevent default newline in input
                sendMessage();
            }
        });

        // Initial welcome message on page load
        window.onload = function() {
            // Check WebSocket state before sending welcome message if needed,
            // but usually, it's okay to display UI message immediately.
            displayMessage("Merhaba! Monster Notebook destek asistanına hoş geldiniz. Size nasıl yardımcı olabilirim?", 'ai');
            messageInput.focus(); // Focus input on load
        };
    </script>
</body>
</html>
